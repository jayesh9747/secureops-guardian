apiVersion: v1
kind: Pod
metadata:
  name: multi-container
  namespace: tests
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: safe-app
      image: example.test/app:1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
    - name: safe-sidecar
      image: example.test/sidecar:1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
  initContainers:
    - name: privileged-init
      image: example.test/init:1
      securityContext:
        privileged: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
  ephemeralContainers:
    - name: root-debugger
      image: example.test/debug:1
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
