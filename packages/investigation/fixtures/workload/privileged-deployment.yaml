apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: commerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalog-api
          image: ghcr.io/example/catalog-api:1.4.0
          securityContext:
            allowPrivilegeEscalation: true
            privileged: true
            readOnlyRootFilesystem: true
            capabilities:
              add:
                - SYS_ADMIN
          ports:
            - name: http
              containerPort: 8080
