apiVersion: v1
kind: Pod
metadata:
  name: root-default-overridden
  namespace: commerce
spec:
  securityContext:
    runAsUser: 0
  containers:
    - name: catalog-api
      image: ghcr.io/example/catalog-api:1.4.0
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
