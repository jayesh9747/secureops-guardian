apiVersion: v1
kind: Pod
metadata:
  name: host-namespaces
  namespace: tests
spec:
  hostNetwork: true
  hostPID: true
  hostIPC: true
  containers:
    - name: app
      image: example.test/app:1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
